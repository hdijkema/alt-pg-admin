<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Alt PG Admin — Fast Elephant</title>
  <desc id="desc">Bold minimal blue elephant head with big ears, visible eyes, curved trunk and two speed streaks, designed for Windows taskbar icons.</desc>
  <defs>
    <clipPath id="round"><rect x="12" y="12" width="488" height="488" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <!-- Three solid, high-contrast colors; no tiny ornaments or lettering. -->
    <rect x="12" y="12" width="488" height="488" rx="112" fill="#102C49"/>

    <!-- The motion cue sits behind the character, so it never breaks the silhouette. -->
    <path d="M40 221H124" stroke="#32E4D4" stroke-width="22" stroke-linecap="round"/>
    <path d="M57 271H117" stroke="#32E4D4" stroke-width="14" stroke-linecap="round"/>

    <!-- The character is deliberately oversized for 16–32 px Windows taskbars. -->
    <g transform="translate(-64 -68) scale(1.25)">
    <!-- Two big ears are the most important recognizable elephant feature. -->
    <path d="M229 169C191 133 142 137 117 181C90 227 109 301 156 334C176 348 202 345 222 327C239 292 240 219 229 169Z"
          fill="#2B85B5"/>
    <path d="M284 169C322 133 371 137 396 181C423 227 404 301 357 334C337 348 311 345 291 327C274 292 273 219 284 169Z"
          fill="#2B85B5"/>
    <!-- Broad ear highlights survive at 32 px but disappear gracefully at 16 px. -->
    <path d="M180 188C148 184 135 219 147 258C153 278 163 291 180 300" fill="none" stroke="#51ADD5" stroke-width="19" stroke-linecap="round"/>
    <path d="M333 188C365 184 378 219 366 258C360 278 350 291 333 300" fill="none" stroke="#51ADD5" stroke-width="19" stroke-linecap="round"/>

    <!-- Large forehead and cheeks, strongly simplified from the classic elephant. -->
    <path d="M256 125C309 125 339 164 339 222C339 266 319 294 310 321C300 351 280 369 256 369C232 369 212 351 202 321C193 294 173 266 173 222C173 164 203 125 256 125Z"
          fill="#69C8E7"/>

    <!-- The trunk is continuous and remains open/curled at the end. -->
    <path d="M257 293C255 328 244 374 262 401C278 426 316 422 334 393"
          fill="none" stroke="#102C49" stroke-width="74" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M257 293C255 328 244 374 262 401C278 426 316 422 334 393"
          fill="none" stroke="#69C8E7" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Friendly, separated eyes. -->
    <ellipse cx="221" cy="231" rx="11" ry="13" fill="#102C49"/>
    <ellipse cx="291" cy="231" rx="11" ry="13" fill="#102C49"/>
    <circle cx="224" cy="227" r="4" fill="#FFFFFF"/>
    <circle cx="294" cy="227" r="4" fill="#FFFFFF"/>

    <!-- Simple ivory tusks; few paths rather than decorative lines. -->
    <path d="M201 294C209 317 224 328 241 329C224 341 204 332 195 317Z" fill="#F8FFFF"/>
    <path d="M311 294C303 317 288 328 271 329C288 341 308 332 317 317Z" fill="#F8FFFF"/>
    </g>
  </g>
</svg>
