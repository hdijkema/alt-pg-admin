name: Linux packages

on:
  workflow_call:
    inputs:
      version:
        description: 'Validated numeric release version; empty builds development packages'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version, e.g. 0.2.0 (build only; does not publish)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  debian:
    name: Debian ${{ matrix.debian }} amd64
    runs-on: ubuntu-24.04
    container: debian:${{ matrix.debian }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13']
    steps:
      - name: Install build and packaging dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential \
            cmake ninja-build pkg-config python3 qt6-base-dev qt6-tools-dev-tools \
            qt6-l10n-tools qt6-svg-dev qt6-translations-l10n libpq-dev libsecret-1-dev \
            dpkg-dev file fonts-dejavu-core
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build, test and package
        shell: bash
        env:
          PGADM_RELEASE_VERSION: ${{ inputs.version }}
        run: ./tools/build-debian.sh
      - name: Install and check the actual package
        shell: bash
        run: |
          apt-get install -y ./dist/*.deb
          for language in nl en de; do
            QT_QPA_PLATFORM=offscreen /usr/bin/pgadmin_qt --language "$language" \
              --settings-file "/tmp/package-$language.ini" --startup-check \
              --startup-report "/tmp/package-$language.txt"
            test -s "/tmp/package-$language.txt"
          done
          command -v pg_dump pg_restore psql createdb dropdb
          dpkg -L alt-pg-admin
      - uses: actions/upload-artifact@v6
        with:
          name: alt-pg-admin-debian${{ matrix.debian }}-amd64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: debian${{ matrix.debian }}-reports
          path: |
            build/debian${{ matrix.debian }}/startup-*.txt
            build/debian${{ matrix.debian }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  flatpak:
    name: Flatpak x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak remote-info --system flathub org.kde.Sdk/x86_64/6.10
          sudo flatpak install --system --noninteractive -y flathub \
            org.kde.Sdk/x86_64/6.10 org.kde.Platform/x86_64/6.10
      - name: Set Flatpak application version
        env:
          PGADM_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 tools/prepare-flatpak.py --version "$PGADM_RELEASE_VERSION" \
            --output packaging/flatpak/build.json
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/build.json
          repository-url: https://dl.flathub.org/repo/flathub.flatpakrepo
          bundle: alt-pg-admin-x86_64.flatpak
          artifact-name: alt-pg-admin-flatpak-x86_64
          upload-artifact: false
          cache: true
      - name: Check installed sandbox and client tools
        run: |
          sudo flatpak install --system --noninteractive -y alt-pg-admin-x86_64.flatpak
          mkdir -p build/flatpak-reports
          for language in nl en de; do
            flatpak run --env=QT_QPA_PLATFORM=offscreen io.github.hdijkema.AltPgAdmin \
              --language "$language" --settings-file "/tmp/smoke-$language.ini" --startup-check \
              --startup-report "$GITHUB_WORKSPACE/build/flatpak-reports/startup-$language.txt"
            test -s "build/flatpak-reports/startup-$language.txt"
          done
          flatpak run --command=sh io.github.hdijkema.AltPgAdmin -ec \
            'for tool in pg_dump pg_restore psql createdb dropdb; do "$tool" --version; done'
          flatpak info --show-permissions io.github.hdijkema.AltPgAdmin
      - name: Name Flatpak package
        env:
          PGADM_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          mv alt-pg-admin-x86_64.flatpak "dist/alt-pg-admin${PGADM_RELEASE_VERSION:+-$PGADM_RELEASE_VERSION}-linux-x86_64.flatpak"
      - uses: actions/upload-artifact@v6
        with:
          name: alt-pg-admin-flatpak-x86_64
          path: dist/*.flatpak
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: flatpak-reports
          path: build/flatpak-reports/*.txt
          if-no-files-found: ignore
          retention-days: 14
