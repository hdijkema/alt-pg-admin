name: macOS package

on:
  workflow_call:
    inputs:
      version:
        description: 'Validated numeric version; empty builds a development package'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version, e.g. 0.2.0 (build only)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  macos:
    name: macOS Apple Silicon DMG
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PGADM_QT_ROOT: ${{ github.workspace }}/build/Qt/6.11.1/macos
      PGADM_RELEASE_VERSION: ${{ inputs.version }}
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check native architecture
        run: test "$(uname -m)" = arm64
      - name: Check packaging dependency audit
        run: python3 tests/test-macos-packaging.py
      - name: Install build and deployment tools
        run: |
          brew install ninja libpq@18 dylibbundler
          python -m pip install 'aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7'
          # The macOS lrelease tool links QtQml, supplied by qtdeclarative.
          python -m aqt install-qt mac desktop 6.11.1 clang_64 --archives qtbase qtdeclarative qtsvg qttools qttranslations --outputdir "$GITHUB_WORKSPACE/build/Qt"
      - name: Check translation compiler
        run: |
          "$PGADM_QT_ROOT/bin/lrelease" -version
      - name: Build, deploy and check DMG
        run: bash tools/build-macos.sh
      - uses: actions/upload-artifact@v6
        with:
          name: pgadmin-jr-macos-arm64
          path: dist/*-macos-arm64.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macos-arm64-reports
          path: |
            build/macos/packaging-*/reports/*
            build/macos/Testing/Temporary/LastTest.log
            build/macos/translations-ui.txt
          if-no-files-found: ignore
          retention-days: 14
